name: check

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Committed PDF and slides match the data
        run: python check.py
      - name: Carousel builds from the data
        run: python build.py
      - name: Fresh build matches the data
        run: python check.py
